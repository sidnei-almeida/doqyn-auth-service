services:
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doqyn_auth}
      POSTGRES_USER: ${POSTGRES_USER:-doqyn_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doqyn_auth_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-doqyn_auth} -d ${POSTGRES_DB:-doqyn_auth}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doqyn_auth}:${POSTGRES_PASSWORD:-doqyn_auth_password}@postgres-auth:5432/${POSTGRES_DB:-doqyn_auth}
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: "no"

  auth-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doqyn_auth}:${POSTGRES_PASSWORD:-doqyn_auth_password}@postgres-auth:5432/${POSTGRES_DB:-doqyn_auth}
    ports:
      - "${PORT:-4100}:4100"
    depends_on:
      postgres-auth:
        condition: service_healthy
    command: ["node", "dist/server.js"]
    restart: unless-stopped

volumes:
  postgres_auth_data:
